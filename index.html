<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gracezu — Projects</title>
  <style>
    :root{
      --bg: #000000;
      --fg: #e6e6e6;
      --muted: #bfbfbf;
      --accent: #ff66b2; /* pink accent */
      --item-border: #222222;
      --error: #ff6f9b;
    }
    html,body{height:100%;}
    body { background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; max-width: 900px; margin: 2rem auto; padding: 1rem; }
    header{ display:flex; align-items:center; gap:1rem; margin-bottom:1rem; }
    .avatar{ width:96px; height:96px; border-radius:50%; object-fit:cover; border:3px solid rgba(255,255,255,0.06); }
    h1 { margin:0; color:var(--accent); font-weight:700; }
    .header-info { display: flex; flex-direction: column; gap: .25rem; }
    .linkedin-link { color:var(--accent); text-decoration:none; font-size:.95rem; }
    .linkedin-link:hover { text-decoration:underline; }
    .projects-title { color:var(--fg); font-weight:700; font-size:1.4rem; margin: 1.5rem 0 1rem 0; }
    .section-title { margin:6px 0 0; color:var(--fg); font-weight:700; font-size:1rem; }
    #summary { color:var(--muted); margin-top:.35rem; }
    #repos { list-style: none; padding: 0; margin: 0; }
    #repos li { border-bottom: 1px solid var(--item-border); padding: .75rem 0; }
    #repos a.repo-name { color:var(--accent); font-weight:800; text-decoration:none; font-size:1.05rem; }
    #repos a.repo-name:hover { text-decoration:underline; }
    .meta { color: var(--muted); font-size: .9rem; margin-top: .35rem; }
    .error { color: var(--error); margin-top: 1rem; }
    a.external { color:var(--accent); }
    /* small responsive tweaks */
    @media (max-width:480px){ .avatar{ width:72px; height:72px; } }
  </style>
</head>
<body>
  <header>
    <img src="assets/avt.jpeg" alt="Grace avatar" class="avatar" onerror="this.style.display='none'" />
    <div class="header-info">
      <h1>Grace (Zu Zu Cho) Oo</h1>
      <a href="https://www.linkedin.com/in/zuzuchooo" class="linkedin-link" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>
  </header>

  <div class="projects-title">Projects</div>
  <ul id="repos" aria-live="polite"></ul>
  <div id="error" class="error" role="alert" hidden></div>

  <script>
    (function () {
      const username = 'gracezu';
      const perPage = 100;
      const reposEl = document.getElementById('repos');
      const errorEl = document.getElementById('error');

      async function fetchAllRepos() {
        let page = 1;
        let all = [];
        let url = `https://api.github.com/users/${username}/repos?per_page=${perPage}&page=${page}`;
        while (url) {
          const res = await fetch(url);
          if (!res.ok) {
            const msg = `GitHub API error: ${res.status} ${res.statusText}`;
            throw new Error(msg);
          }
          const data = await res.json();
          all.push(...data);

          const link = res.headers.get('link');
          if (link) {
            // find rel="next" link if present
            const match = link.match(/<([^>]+)>;\s*rel="next"/);
            url = match ? match[1] : null;
          } else {
            url = null;
          }
        }
        return all;
      }

      function render(repos) {
        if (!repos || repos.length === 0) {
          return;
        }
        // remove the repository that is the Pages site itself from the count & list
        const filtered = repos.filter(r => r.name.toLowerCase() !== 'gracezu.github.io');
        // sort by updated_at desc
        filtered.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
        filtered.forEach(r => {
          const li = document.createElement('li');

          const a = document.createElement('a');

          // special-case: point this repo to the hosted site instead of GitHub
          let href = r.html_url;
          let target = '_blank';
          if (r.name === 'tech-energy-stock-forecasting') {
            href = 'https://gracezu.github.io/tech-energy-stock-forecasting/';
            target = '_self'; // open in same tab (go directly)
          }

          a.href = href;
          a.textContent = r.name;
          a.target = target;
          a.rel = 'noopener noreferrer';
          a.className = 'repo-name external';
          li.appendChild(a);

          const meta = document.createElement('div');
          meta.className = 'meta';
          const parts = [];
          if (r.description) parts.push(r.description);
          // only show star count when > 0
          if (r.stargazers_count && r.stargazers_count > 0) {
            parts.push(`★ ${r.stargazers_count}`);
          }
          if (r.language) parts.push(r.language);
          meta.textContent = parts.join(' · ');
          if (meta.textContent) li.appendChild(meta);

          reposEl.appendChild(li);
        });
      }

      async function main() {
        try {
          const repos = await fetchAllRepos();
          render(repos);
        } catch (err) {
          console.error(err);
          errorEl.hidden = false;
          if (err.message.includes('403')) {
            errorEl.textContent = 'API rate limit reached. Try again later or use a server-side approach with authentication.';
          } else {
            errorEl.textContent = err.message;
          }
        }
      }

      main();
    })();
        <!-- Load Three.js (Required for Vanta Net) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <!-- Load Vanta.js Net Effect -->
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

  <script>
    VANTA.NET({
      el: "body", // Applies the background to the entire page
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xff3f81,           // Hex for 16727937
      backgroundColor: 0x23153c, // Hex for 2299196
      points: 10.00,
      maxDistance: 20.00,
      spacing: 15.00,
      showDots: true
    })
  </script>
  
</body>
</html>
