<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gracezu — Repositories</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .5rem; }
    #repos { list-style: none; padding: 0; margin: 1rem 0; }
    #repos li { border-bottom: 1px solid #eee; padding: .75rem 0; }
    .meta { color: #666; font-size: .9rem; margin-top: .35rem; }
    .error { color: #a00; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Repositories — gracezu</h1>
  <p id="summary">Loading repositories…</p>
  <ul id="repos" aria-live="polite"></ul>
  <div id="error" class="error" role="alert" hidden></div>

  <script>
    (function () {
      const username = 'gracezu';
      const perPage = 100;
      const reposEl = document.getElementById('repos');
      const summaryEl = document.getElementById('summary');
      const errorEl = document.getElementById('error');

      async function fetchAllRepos() {
        let page = 1;
        let all = [];
        let url = `https://api.github.com/users/${username}/repos?per_page=${perPage}&page=${page}`;
        while (url) {
          const res = await fetch(url);
          if (!res.ok) {
            const msg = `GitHub API error: ${res.status} ${res.statusText}`;
            throw new Error(msg);
          }
          const data = await res.json();
          all.push(...data);

          const link = res.headers.get('link');
          if (link) {
            // find rel="next" link if present
            const match = link.match(/<([^>]+)>;\s*rel="next"/);
            url = match ? match[1] : null;
          } else {
            url = null;
          }
        }
        return all;
      }

      function render(repos) {
        if (!repos || repos.length === 0) {
          summaryEl.textContent = 'No repositories found.';
          return;
        }
        summaryEl.textContent = `Showing ${repos.length} public repositories.`;
        // sort by updated_at desc
        repos.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
        repos.forEach(r => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = r.html_url;
          a.textContent = r.name;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          li.appendChild(a);

          const meta = document.createElement('div');
          meta.className = 'meta';
          const parts = [];
          if (r.description) parts.push(r.description);
          parts.push(`★ ${r.stargazers_count}`);
          if (r.language) parts.push(r.language);
          meta.textContent = parts.join(' · ');
          li.appendChild(meta);

          reposEl.appendChild(li);
        });
      }

      async function main() {
        try {
          const repos = await fetchAllRepos();
          render(repos);
        } catch (err) {
          console.error(err);
          errorEl.hidden = false;
          if (err.message.includes('403')) {
            errorEl.textContent = 'API rate limit reached. Try again later or use a server-side approach with authentication.';
          } else {
            errorEl.textContent = err.message;
          }
          summaryEl.textContent = '';
        }
      }

      main();
    })();
  </script>
</body>
</html>
